
name: NexaStore CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore NexaStore.slnx

      - name: Build
        run: dotnet build NexaStore.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test NexaStore.slnx --configuration Release --no-build --logger "console;verbosity=normal"
